# Local deployment: the API and the chat interface.
#
# Supabase stays hosted - the index lives there and the migrations are applied
# with the Supabase CLI, not from here. Ollama stays on the host by default,
# because a model pulled inside a container is a second copy of several
# gigabytes; `--profile ollama` runs one here instead.

services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # localhost inside a container is the container. This is the address of
      # the host's Ollama; with `--profile ollama` override it to
      # http://ollama:11434 in .env.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    extra_hosts:
      # Docker Desktop resolves this name on its own; on Linux it has to be
      # spelled out.
      - "host.docker.internal:host-gateway"
    volumes:
      # The embedding model is ~1.5 GB and is fetched on first start. Without
      # this it is fetched again after every `docker compose down`.
      - huggingface-cache:/cache/huggingface
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        # The browser runs on the host, so this address has to work there -
        # not inside the compose network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Opt-in: `docker compose --profile ollama up`. Pull the model once it is
  # running: `docker compose exec ollama ollama pull qwen2.5:7b`.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  huggingface-cache:
  ollama-models:
