[project]
name = "contract-rag"
version = "0.1.0"
description = "RAG pipeline for legal contracts with clause and page citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "litellm",
    "pydantic>=2.13.5",
    "pymupdf",
    "python-docx",
    "python-dotenv",
    "python-multipart>=0.0.32",
    "sentence-transformers",
    "supabase",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# The HTTP layer in api/ and the eval harness in eval/ both live next to src/
# rather than inside the installed package, so the repo root has to be
# importable for the tests that cover them.
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
