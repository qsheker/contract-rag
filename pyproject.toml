[project]
name = "contract-rag"
version = "0.1.0"
description = "RAG pipeline for legal contracts with clause and page citations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "python-docx",
    "python-dotenv",
    "sentence-transformers",
    "supabase",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
